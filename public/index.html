<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مجموعة النسيم | نظام الإدارة المحلي</title><link rel="stylesheet" href="/styles.css"></head><body><section id="login" class="login-wrap"><form id="loginForm" class="login-card" autocomplete="off"><div class="logo">ن</div><h1>مجموعة النسيم</h1><p>نظام إدارة قاعات الأفراح</p><label>اسم المستخدم<input name="username" autocomplete="off" required value=""></label><label>كلمة المرور<input name="password" type="password" autocomplete="off" required></label><button>تسجيل الدخول</button><small>اسم المستخدم الافتراضي: admin — غيّر كلمة المرور فورًا بعد تسجيل الدخول.</small><div id="loginError" class="error"></div></form></section><div id="app" hidden><header><div><b>مجموعة النسيم لقاعات الأفراح</b><small>نظام إدارة محلي</small></div><div class="header-actions"><button id="mobileNavToggle" class="mobile-nav-toggle" type="button" aria-controls="nav" aria-expanded="false">☰ القائمة</button><span id="who"></span><button id="changeOwnPassword" class="secondary" type="button">تغيير كلمة المرور</button><div class="bell-wrap"><button id="notificationBell" class="bell-button" type="button" aria-label="التنبيهات">♧<span id="bellCount" class="bell-count" hidden>0</span></button><div id="bellMenu" class="bell-menu" hidden><div class="bell-menu-head"><b>آخر التنبيهات</b><button type="button" class="secondary" id="openAllNotifications">عرض الكل</button></div><div id="bellItems"></div></div></div><button id="logout" class="secondary">خروج</button></div></header><aside id="nav"><button data-page="dashboard">لوحة المتابعة</button><div class="nav-group"><button class="nav-group-toggle" type="button" data-group="customersGroup">العملاء والحجوزات <span>⌄</span></button><div class="nav-subgroup" id="customersGroup"><button data-page="followups">الاستفسارات والمتابعة</button><button data-page="inquiry_register">سجل الاستفسارات والمتابعة</button><button data-page="bookings">الحجوزات</button><button data-page="service_events">المناسبات والخدمات المستقلة</button><button data-page="invitations">بطاقات الدعوة الإلكترونية</button><button data-page="day_bookings">حجوزات الفرح النهاري</button><button data-page="booking_archive">سجل الحجوزات المكتملة والمؤجلة والملغاة</button><button data-page="notifications">التنبيهات</button></div></div><div class="nav-group"><button class="nav-group-toggle" type="button" data-group="operationsGroup">التشغيل <span>⌄</span></button><div class="nav-subgroup" id="operationsGroup"><button data-page="halls">القاعات</button><button data-page="packages">باكدجات القاعات</button><button data-page="buffet">باكدجات البوفيه وأصنافها</button><button data-page="addons">إضافات البوفيه</button><button data-page="operations_addons">إضافات التشغيل</button><button data-page="inventory">المخزن</button><button data-page="work_orders">أوامر الشغل</button><button data-page="offers">العروض</button></div></div><button data-page="contractors">إضافة المتعهدين</button><div class="nav-group"><button class="nav-group-toggle" type="button" data-group="financeGroup">المالية والخزنة <span>⌄</span></button><div class="nav-subgroup" id="financeGroup"><button data-page="finance">تحصيل النقدية</button><button data-page="expenses">المصروفات والمشتريات</button><button data-page="cashbox">حركة الخزنة / اليومية</button><button data-page="accounting">المحاسبة العامة</button></div></div><div class="nav-group" id="managerApprovalsGroup"><button class="nav-group-toggle" type="button" data-group="managerApprovalsGroup">طلبات موافقات <span>⌄</span></button><div class="nav-subgroup" id="managerApprovalsSub"><button data-page="discounts">طلبات الخصم الإضافية</button><button data-page="booking_change_approvals">طلب تعديل موعد أو إلغاء حجز</button></div></div><button data-page="backup">النسخ الاحتياطي</button><button data-page="users">الموظفون والصلاحيات</button><div class="nav-group"><button class="nav-group-toggle" type="button" data-group="reportsGroup">التقارير <span>⌄</span></button><div class="nav-subgroup" id="reportsGroup"><button data-page="reports">التقارير العامة</button><button data-page="sales_performance">أداء مبيعات الموظفين</button><button data-page="contractor_report">تقرير المتعهدين</button></div></div></aside><main><div id="notice"></div><section id="page"></section></main></div><div id="followupModal" class="modal-backdrop" hidden><div class="modal-card"><div class="modal-head"><h3>تسجيل نتيجة المتابعة</h3><button type="button" class="secondary" id="closeFollowupModal">إغلاق</button></div><form id="followupResultForm" class="grid-form"><input type="hidden" name="followup_id"><input type="hidden" name="inquiry_id"><label class="full">حالة العميل<select name="result" id="followupResultSelect" required><option value="">اختر حالة العميل</option><option value="answered_rebook">تم التواصل وطلب متابعة أخرى</option><option value="no_answer">لم يرد</option><option value="will_book">سيحجز</option><option value="not_booking">لم يتم الحجز</option><option value="booked">حضر العميل / تم الحجز</option></select></label><label id="followupReasonWrap" class="full" hidden>سبب عدم الحجز (إجباري)<textarea name="reason" id="followupReason" placeholder="اكتب سبب عدم الحجز بالتفصيل"></textarea></label><label id="followupNextWrap" class="full" hidden>موعد المتابعة القادمة<input type="datetime-local" name="next_followup_at" id="followupNext"></label><div class="full"><button type="submit">حفظ نتيجة المتابعة</button></div></form></div></div><script src="/app.js"></script></body></html>
